name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # matches DATABASE_URL expected by server/.env.example
          POSTGRES_DB: codown
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Exported so they win over server/.env (plain dotenv does not expand
      # ${VARS} and does not override pre-set environment variables)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codown
      # Server binds PORT=5001 per server/.env.example; used by the
      # collaboration specs to seed the second user directly against the API
      E2E_API_URL: http://localhost:5001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        # no version input: read from packageManager in package.json (11.1.1)

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Initialize Enviroment
        run: |
          cp server/.env.example server/.env
          cp client/.env.example client/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter server db:generate

      - name: Apply Prisma migrations
        run: pnpm --filter server db:migrate:prod

      - name: Install Playwright browsers
        run: pnpm --filter client exec playwright install --with-deps chromium

      # CI=1 makes Playwright start the full dev stack itself via webServer
      # (nothing reuses an existing server) with retries and serial workers
      - name: Run E2E tests
        run: pnpm --filter client test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: client/test-results/
          retention-days: 7
